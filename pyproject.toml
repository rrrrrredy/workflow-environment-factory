[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-environment-factory"
version = "0.1.0"
description = "Turn real repositories and Issue-to-PR workflows into resettable, variable, objectively scored Codex environments."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Song Luo" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = [
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.4"
]

[project.urls]
Homepage = "https://github.com/rrrrrredy/workflow-environment-factory"
Issues = "https://github.com/rrrrrredy/workflow-environment-factory/issues"
Security = "https://github.com/rrrrrredy/workflow-environment-factory/security/policy"

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "ruff==0.16.5"
]

[project.scripts]
wef = "workflow_environment_factory.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
