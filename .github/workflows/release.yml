name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WEF_DOCKER_GATE_IMAGE: python:3.11.16-slim-bookworm@sha256:0bee7276f83efd4a1ee05bbbf4281d95ed28e079220a9457f25a93e3f1e3c31b
    steps:
      - uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: rrrrrredy/agent-run-protocol
          ref: v0.1.0
          path: protocol
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: product/requirements.lock
      - name: Install pinned Codex CLI for doctor
        run: npm install --global @openai/codex@0.150.0-alpha.8
      - name: Build, verify real Docker gates, and package
        shell: pwsh
        working-directory: product
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $protocolRoot = (Resolve-Path ../protocol).Path
          ./scripts/Package-Release.ps1 -Version $version -ProtocolRoot $protocolRoot -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE "artifacts")
      - name: Attest release archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts -File | ForEach-Object FullName) --verify-tag --generate-notes --title "Workflow Environment Factory ${{ github.ref_name }}"
