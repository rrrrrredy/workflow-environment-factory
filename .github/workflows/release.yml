name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-installation:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrrrredy/runcase-interchange
          ref: v0.1.0
          path: protocol
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: product/requirements.lock
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.150.0-alpha.8
      - name: Verify clean Windows installation lifecycle
        run: |
          $protocolRoot = (Resolve-Path ..\protocol).Path
          .\scripts\Acceptance-InstallUninstall.ps1 -ProtocolRoot $protocolRoot -EvidencePath (Join-Path $env:RUNNER_TEMP "factory-installation-evidence.json")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-installation-evidence
          path: ${{ runner.temp }}\factory-installation-evidence.json
          if-no-files-found: error

  release:
    needs: windows-installation
    runs-on: ubuntu-latest
    env:
      WEF_DOCKER_GATE_IMAGE: python:3.11.16-slim-bookworm@sha256:0bee7276f83efd4a1ee05bbbf4281d95ed28e079220a9457f25a93e3f1e3c31b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrrrredy/runcase-interchange
          ref: v0.1.0
          path: protocol
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: product/requirements.lock
      - name: Install pinned Codex CLI for doctor
        run: npm install --global @openai/codex@0.150.0-alpha.8
      - name: Build, verify real Docker gates, and package
        shell: pwsh
        working-directory: product
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $protocolRoot = (Resolve-Path ../protocol).Path
          ./scripts/Package-Release.ps1 -Version $version -ProtocolRoot $protocolRoot -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE "artifacts")
      - name: Run release UI gate
        working-directory: product
        env:
          WEF_UI_OUTPUT_DIR: ${{ runner.temp }}/factory-ui-evidence
          WEF_PROBE_TMP_ROOT: ${{ runner.temp }}/factory-ui-data
          WEF_PYTHON: ${{ github.workspace }}/product/.venv/bin/python
        run: |
          npx playwright install --with-deps chromium
          npm run probe:ui
      - name: Download clean Windows installation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-installation-evidence
          path: artifacts
      - name: Attest release archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.release.json
            artifacts/factory-installation-evidence.json
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts -File | ForEach-Object FullName) --verify-tag --generate-notes --title "Workflow Environment Factory ${{ github.ref_name }}"
