name: release

on:
  push:
    tags:
      - 'v0.2.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      WEF_DOCKER_GATE_IMAGE: python:3.11.16-slim-bookworm@sha256:0bee7276f83efd4a1ee05bbbf4281d95ed28e079220a9457f25a93e3f1e3c31b
    steps:
      - name: Require public repository for provenance
        shell: pwsh
        run: |
          if ("${{ github.event.repository.visibility }}" -ne "public") {
            throw "Publish the reviewed repository and enable public protections before pushing a release tag; GitHub cannot attest a private personal repository."
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrrrredy/runcase-interchange
          ref: 462fa2fa7cdaa8f58cd4c1dcc9cf778e1d2d0073
          path: protocol
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: product/requirements.lock
      - name: Install pinned Codex CLI for doctor
        working-directory: product
        run: npm install --global @openai/codex@0.151.0
      - name: Build, verify real Docker gates, and package
        shell: pwsh
        working-directory: product
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $protocolRoot = (Resolve-Path ../protocol).Path
          ./scripts/Package-Release.ps1 -Version $version -ProtocolRoot $protocolRoot -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE "candidate")
          node scripts/Package-Portable-Release.mjs --version $version --output (Join-Path $env:GITHUB_WORKSPACE "candidate")
          ./.venv/bin/python ./spikes/codex_read_isolation_gate.py --codex codex --evidence (Join-Path $env:GITHUB_WORKSPACE "candidate/factory-linux-build-read-isolation.json")
      - name: Run release UI gate
        working-directory: product
        env:
          WEF_UI_OUTPUT_DIR: ${{ runner.temp }}/factory-ui-evidence
          WEF_PROBE_TMP_ROOT: ${{ runner.temp }}/factory-ui-data
          WEF_PYTHON: ${{ github.workspace }}/product/.venv/bin/python
        run: |
          npx playwright install --with-deps chromium
          npm run probe:ui
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-release-candidate
          path: candidate
          if-no-files-found: error

  windows-installation:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.13'
      - name: Install pinned Codex CLI for archive lifecycle acceptance
        shell: pwsh
        run: npm install --global @openai/codex@0.151.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-release-candidate
          path: ${{ runner.temp }}\factory-release
      - name: Verify the extracted release archive lifecycle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $candidateRoot = Join-Path $env:RUNNER_TEMP "factory-release"
          $archive = Join-Path $candidateRoot "workflow-environment-factory-$version-windows-x64.zip"
          $expected = (Get-Content "$archive.sha256").Split()[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Release archive checksum mismatch before acceptance." }
          $extractRoot = Join-Path $env:RUNNER_TEMP "factory-release-install"
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $releaseRoot = Join-Path $extractRoot "workflow-environment-factory-$version"
          $evidencePath = Join-Path $env:RUNNER_TEMP "factory-installation-evidence.json"
          & (Join-Path $releaseRoot "scripts\Acceptance-InstallUninstall.ps1") -UseDockerStub -EvidencePath $evidencePath
          $readIsolationPath = Join-Path $env:RUNNER_TEMP "factory-windows-read-isolation.json"
          & (Join-Path $releaseRoot ".venv\Scripts\python.exe") (Join-Path $releaseRoot "spikes\codex_read_isolation_gate.py") --codex codex --evidence $readIsolationPath
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne "product.installation-acceptance.v3") { throw "Unsupported installation evidence schema." }
          if ($evidence.source_kind -ne "release_archive") { throw "Acceptance did not run from the release archive." }
          if ($evidence.tested_commit -ne $env:GITHUB_SHA) { throw "Archive commit does not match the release tag commit." }
          if ($evidence.docker_check.mode -ne "command_stub" -or [bool]$evidence.docker_check.same_host_server_proven) {
            throw "Hosted Windows evidence must disclose that Docker Desktop was not proven on the same host."
          }
          foreach ($check in @(
            "clean_isolated_codex_home",
            "failed_install_rolled_back",
            "failed_repair_restored_existing_install",
            "docker_prerequisite_path_passed",
            "service_started",
            "loopback_only",
            "plugin_installed",
            "marketplace_registered",
            "startup_created_and_removed",
            "default_uninstall_preserved_data",
            "reinstall_preserved_data",
            "explicit_delete_removed_data",
            "final_plugin_absent",
            "final_marketplace_absent",
            "final_service_absent",
            "installation_state_audit_passed"
          )) {
            $property = $evidence.checks.PSObject.Properties[$check]
            if ($null -eq $property -or -not [bool]$property.Value) { throw "Installation evidence failed or omitted: $check" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-installation-evidence
          path: |
            ${{ runner.temp }}\factory-installation-evidence.json
            ${{ runner.temp }}\factory-windows-read-isolation.json
          if-no-files-found: error

  portable-lifecycle:
    needs: build
    name: portable ${{ matrix.platform }} archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            skip_docker: '0'
          - os: macos-14
            platform: macos
            skip_docker: '1'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.13'
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.151.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify and exercise the extracted portable archive
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          WEF_PORTABLE_HOSTED_CI: '1'
          WEF_PORTABLE_SKIP_DOCKER_CHECK: ${{ matrix.skip_docker }}
          WEF_PORTABLE_TEST_DATA_DIR: ${{ runner.temp }}/factory-data
          WEF_PORTABLE_EVIDENCE_DIR: ${{ runner.temp }}/factory-portable-evidence
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/candidate/workflow-environment-factory-$version-portable.tar.gz"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"); const p=process.argv[1], e=fs.readFileSync(`${p}.sha256`,"utf8").trim().split(/\s+/)[0], a=crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); if(a!==e) process.exit(1)' "$archive"
          mkdir -p "$RUNNER_TEMP/extracted" "$CODEX_HOME"
          tar -xzf "$archive" -C "$RUNNER_TEMP/extracted"
          root="$RUNNER_TEMP/extracted/workflow-environment-factory-$version"
          chmod +x "$root"/scripts/*.sh
          cd "$root"
          ./scripts/Acceptance-Portable.sh
          .venv/bin/python spikes/codex_read_isolation_gate.py --codex codex --evidence "$WEF_PORTABLE_EVIDENCE_DIR/factory-${{ matrix.platform }}-read-isolation.json"
          mv "$WEF_PORTABLE_EVIDENCE_DIR/running.json" "$WEF_PORTABLE_EVIDENCE_DIR/factory-${{ matrix.platform }}-running.json"
          mv "$WEF_PORTABLE_EVIDENCE_DIR/absent.json" "$WEF_PORTABLE_EVIDENCE_DIR/factory-${{ matrix.platform }}-absent.json"
          mv "$WEF_PORTABLE_EVIDENCE_DIR/uninstall.txt" "$WEF_PORTABLE_EVIDENCE_DIR/factory-${{ matrix.platform }}-uninstall.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-${{ matrix.platform }}-archive-evidence
          path: ${{ runner.temp }}/factory-portable-evidence
          if-no-files-found: error

  publish:
    needs: [build, windows-installation, portable-lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-release-candidate
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-installation-evidence
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-linux-archive-evidence
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-macos-archive-evidence
          path: artifacts
      - name: Attest release archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.release.json
            artifacts/factory-installation-evidence.json
            artifacts/*-running.json
            artifacts/*-absent.json
            artifacts/*-uninstall.txt
            artifacts/*-read-isolation.json
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notesFile = Join-Path $env:GITHUB_WORKSPACE "product/docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) { throw "Missing curated release notes: $notesFile" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts -File | ForEach-Object FullName) --repo "${{ github.repository }}" --verify-tag --notes-file $notesFile --prerelease --title "Workflow Environment Factory ${{ github.ref_name }}"
