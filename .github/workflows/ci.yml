name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-product:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrrrredy/runcase-interchange
          ref: 462fa2fa7cdaa8f58cd4c1dcc9cf778e1d2d0073
          path: protocol
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.13'
          cache: pip
          cache-dependency-path: product/requirements.lock
      - name: Check Windows product
        run: |
          $protocolRoot = (Resolve-Path ..\protocol).Path
          .\scripts\Check.ps1 -InstallDependencies -ProtocolRoot $protocolRoot
      - name: Install pinned Codex CLI for clean lifecycle acceptance
        run: npm install --global @openai/codex@0.151.0
      - name: Prove the Agent shell cannot read the product database or source solution
        run: |
          .\.venv\Scripts\python.exe .\spikes\codex_read_isolation_gate.py --codex codex --evidence (Join-Path $env:RUNNER_TEMP "factory-windows-read-isolation.json")
      - name: Verify Windows install, start, preserve, reinstall, delete, and uninstall
        run: |
          $protocolRoot = (Resolve-Path ..\protocol).Path
          .\scripts\Acceptance-InstallUninstall.ps1 -UseDockerStub -ProtocolRoot $protocolRoot -EvidencePath (Join-Path $env:RUNNER_TEMP "factory-installation-evidence.json")
      - name: Install CI Chromium
        run: npx playwright install chromium
      - name: Run the single UI golden scenario
        env:
          WEF_UI_OUTPUT_DIR: ${{ runner.temp }}\factory-ui-evidence
          WEF_PROBE_TMP_ROOT: ${{ runner.temp }}\factory-ui-data
          WEF_PYTHON: ${{ github.workspace }}\product\.venv\Scripts\python.exe
        run: npm run probe:ui
      - name: Upload synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-ui-evidence
          path: ${{ runner.temp }}\factory-ui-evidence
          if-no-files-found: warn
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-installation-evidence
          path: ${{ runner.temp }}\factory-installation-evidence.json
          if-no-files-found: error
      - name: Upload Windows read-isolation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-windows-read-isolation-evidence
          path: ${{ runner.temp }}\factory-windows-read-isolation.json
          if-no-files-found: error

  docker-golden:
    runs-on: ubuntu-24.04
    env:
      WEF_DOCKER_GATE_IMAGE: python:3.11.16-slim-bookworm@sha256:0bee7276f83efd4a1ee05bbbf4281d95ed28e079220a9457f25a93e3f1e3c31b
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrrrredy/runcase-interchange
          ref: 462fa2fa7cdaa8f58cd4c1dcc9cf778e1d2d0073
          path: protocol
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: product/requirements.lock
      - name: Install pinned Codex CLI for doctor
        run: npm install --global @openai/codex@0.151.0
      - name: Run Docker code and Issue-to-PR gates
        shell: pwsh
        run: |
          $protocolRoot = (Resolve-Path ../protocol).Path
          ./scripts/Check.ps1 -InstallDependencies -RequireDocker -ProtocolRoot $protocolRoot

  portable-lifecycle:
    name: ${{ matrix.platform }} lifecycle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            skip_docker: '0'
          - os: macos-14
            platform: macos
            skip_docker: '1'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: product
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrrrredy/runcase-interchange
          ref: 462fa2fa7cdaa8f58cd4c1dcc9cf778e1d2d0073
          path: protocol
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.13'
          cache: pip
          cache-dependency-path: product/requirements.lock
      - name: Build and run portable product checks
        run: |
          node scripts/sync-protocol.mjs --protocol-root ../protocol
          npm ci
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --constraint requirements.lock --editable '.[dev]'
          npm run build:web
          .venv/bin/python -m ruff check backend tests spikes/synthetic_server.py spikes/docker_gate.py spikes/real_codex_gate.py spikes/codex_read_isolation_gate.py
          .venv/bin/python -m pytest -q
          npm run test:portable
          node scripts/validate-plugin.mjs
      - name: Install pinned Codex CLI for isolated plugin lifecycle
        run: npm install --global @openai/codex@0.151.0
      - name: Prove the Agent shell cannot read the product database or source solution
        env:
          WEF_READ_ISOLATION_EVIDENCE_DIR: ${{ runner.temp }}/factory-portable-evidence
        run: |
          mkdir -p "$WEF_READ_ISOLATION_EVIDENCE_DIR"
          .venv/bin/python spikes/codex_read_isolation_gate.py --codex codex --evidence "$WEF_READ_ISOLATION_EVIDENCE_DIR/factory-${{ matrix.platform }}-read-isolation.json"
      - name: Install, start, inspect, restart, uninstall, and prove absence
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          WEF_PORTABLE_HOSTED_CI: '1'
          WEF_PORTABLE_SKIP_DOCKER_CHECK: ${{ matrix.skip_docker }}
          WEF_PORTABLE_TEST_DATA_DIR: ${{ runner.temp }}/factory-data
          WEF_PORTABLE_EVIDENCE_DIR: ${{ runner.temp }}/factory-portable-evidence
        run: |
          mkdir -p "$CODEX_HOME"
          chmod +x scripts/*.sh
          ./scripts/Acceptance-Portable.sh
      - name: Upload portable lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-${{ matrix.platform }}-lifecycle-evidence
          path: ${{ runner.temp }}/factory-portable-evidence
          if-no-files-found: error
